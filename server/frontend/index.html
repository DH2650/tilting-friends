<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity Web Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="connectionStatus" class="status-message info">Connecting to server...</div>
<div id="controllerIdDisplay" class="status-message">My Controller ID: N/A</div>
<div id="playerIdDisplay" class="status-message">Assigned Player ID: N/A</div>

<div id="roomCodeInput" class="input-section" style="display: none;">
    <input type="text" id="playerIdInput" placeholder="Enter Player ID/Name">
    <button id="joinGameButton">Join Game</button>
</div>

<div class="gyro-container">
    <h2 class="section-title">Gyroscope Data</h2>
    <p class="section-description">Move your device to see the values change.</p>

    <button id="requestPermission" class="permission-button hidden">
        Enable Gyroscope
    </button>

    <div id="messageBox" class="message-box"></div>

    <div class="data-display">
        <div class="data-item">
            <span>Alpha (Z-axis):</span>
            <span id="alpha" class="value">0.00</span>
        </div>
        <div class="data-item">
            <span>Beta (X-axis):</span>
            <span id="beta" class="value">0.00</span>
        </div>
        <div class="data-item">
            <span>Gamma (Y-axis):</span>
            <span id="gamma" class="value">0.00</span>
        </div>
    </div>
</div>
<div id="controls" class="controls" style="display: none;">
    <button id="buttonUp">Up</button>

    <div class="horizontal-buttons">
        <button id="buttonLeft">Left</button>
        <button id="buttonRight">Right</button>
    </div>
    <button id="buttonDown">Down</button>

    <button id="buttonActionA" class="action-button">Action A</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="controller.js"></script>
</body>
</html>
