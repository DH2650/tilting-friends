<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Gyroscope</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom CSS for Inter font and basic body styling */
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Ensure it takes full viewport height */
      background-color: #f0f4f8; /* Light background */
      color: #333; /* Dark text */
      padding: 1rem; /* Padding around the content */
      box-sizing: border-box; /* Include padding in element's total width and height */
    }
    .container {
      background-color: #ffffff; /* White background for the main container */
      border-radius: 1.5rem; /* More rounded corners */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Soft shadow */
      padding: 2rem;
      max-width: 90%; /* Max width for responsiveness */
      width: 400px; /* Fixed width on larger screens */
      text-align: center;
    }
    .data-display {
      display: flex;
      flex-direction: column;
      gap: 1rem; /* Space between data items */
      margin-top: 1.5rem;
    }
    .data-item {
      background-color: #e2e8f0; /* Light gray background for each data item */
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem; /* Rounded corners for data items */
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.125rem; /* Larger font size */
      font-weight: 500;
      color: #2d3748; /* Darker text for data items */
    }
    .value {
      font-weight: 700;
      color: #4299e1; /* Blue color for values */
    }
    .permission-button {
      background-color: #4299e1; /* Blue button */
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 1.5rem;
      transition: background-color 0.3s ease;
    }
    .permission-button:hover {
      background-color: #3182ce; /* Darker blue on hover */
    }
    .message-box {
      background-color: #fff3cd; /* Light yellow background */
      border: 1px solid #ffeeba; /* Yellow border */
      color: #856404; /* Dark yellow text */
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      text-align: left;
      display: none; /* Hidden by default */
    }
  </style>
</head>
<body>
<div class="container">
  <h1 class="text-3xl font-bold mb-4 text-gray-800">Gyroscope Data</h1>
  <p class="text-gray-600 mb-6">Move your device to see the values change.</p>

  <button id="requestPermission" class="permission-button hidden">
    Enable Gyroscope
  </button>

  <div id="messageBox" class="message-box"></div>

  <div class="data-display">
    <div class="data-item">
      <span>Alpha (Z-axis):</span>
      <span id="alpha" class="value">0.00</span>
    </div>
    <div class="data-item">
      <span>Beta (X-axis):</span>
      <span id="beta" class="value">0.00</span>
    </div>
    <div class="data-item">
      <span>Gamma (Y-axis):</span>
      <span id="gamma" class="value">0.00</span>
    </div>
  </div>
</div>

<script>
  // Get references to HTML elements where data will be displayed
  const alphaElement = document.getElementById('alpha');
  const betaElement = document.getElementById('beta');
  const gammaElement = document.getElementById('gamma');
  const requestPermissionButton = document.getElementById('requestPermission');
  const messageBox = document.getElementById('messageBox');

  // Function to display messages in the custom message box
  function showMessage(message, type = 'info') {
    messageBox.textContent = message;
    messageBox.style.display = 'block';
    // You could add different styling based on 'type' (e.g., 'error', 'success')
  }

  // Function to hide the message box
  function hideMessageBox() {
    messageBox.style.display = 'none';
  }

  // Function to handle gyroscope data updates
  function handleDeviceOrientation(event) {
    // event.alpha: Rotation around the Z-axis (0 to 360 degrees)
    // event.beta: Rotation around the X-axis (-180 to 180 degrees)
    // event.gamma: Rotation around the Y-axis (-90 to 90 degrees)

    // Update the text content of the elements with formatted values
    alphaElement.textContent = event.alpha ? event.alpha.toFixed(2) : 'N/A';
    betaElement.textContent = event.beta ? event.beta.toFixed(2) : 'N/A';
    gammaElement.textContent = event.gamma ? event.gamma.toFixed(2) : 'N/A';
  }

  // Check for DeviceOrientationEvent support and handle permissions
  function setupGyroscope() {
    // Check if DeviceOrientationEvent is supported by the browser
    if (window.DeviceOrientationEvent) {
      // For iOS 13+ and some other browsers, explicit permission is required
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        // Show the permission request button
        requestPermissionButton.classList.remove('hidden');
        requestPermissionButton.onclick = () => {
          DeviceOrientationEvent.requestPermission()
                  .then(permissionState => {
                    if (permissionState === 'granted') {
                      // Permission granted, add the event listener
                      window.addEventListener('deviceorientation', handleDeviceOrientation);
                      requestPermissionButton.classList.add('hidden'); // Hide button
                      hideMessageBox(); // Hide any previous messages
                    } else {
                      // Permission denied
                      showMessage('Permission to access gyroscope was denied. Please allow it in your device settings.', 'error');
                    }
                  })
                  .catch(error => {
                    console.error("Error requesting device orientation permission:", error);
                    showMessage('Error requesting permission: ' + error.message, 'error');
                  });
        };
      } else {
        // No explicit permission required (older iOS, Android, desktop browsers)
        window.addEventListener('deviceorientation', handleDeviceOrientation);
        showMessage('Gyroscope data is being streamed. Move your device!', 'info');
      }
    } else {
      // DeviceOrientationEvent is not supported
      showMessage('Your browser does not support Device Orientation events. Gyroscope data cannot be accessed.', 'error');
    }
  }

  // Call the setup function when the DOM is fully loaded
  document.addEventListener('DOMContentLoaded', setupGyroscope);
</script>
</body>
</html>
